# Configuracion de DOSBox para el laboratorio de la Unidad 5

[cpu]
# core normal da una velocidad adecuada para trabajar con NASM
core=normal
cputype=auto
cycles=8000

[dosbox]
memsize=16

[render]
# escala la ventana al doble para que se lea mejor
scaler=normal2x

[autoexec]
# Monta solo la carpeta del repositorio como unidad C
mount c "C:\arq\Jaimes-post1-u5"
c:
# Agrega C:\ al PATH para usar nasm desde cualquier carpeta
path %path%;C:\
echo DOSBox listo. Directorio de trabajo: C:\
cls
